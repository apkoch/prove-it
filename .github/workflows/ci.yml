name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # prove-red compares against the merge base
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: uv sync --locked
      - run: just check
